global:
  scrape_interval: 2s
rule_files:
  - "prometheus.rules.yml"

scrape_configs:
  - job_name: 'metrics_exporter'
    static_configs:
      - targets: ['metrics_exporter:18000']

  - job_name: 'backend_app'
    static_configs:
      - targets: ['backend_app:8000']

  - job_name: 'model_server'
    static_configs:
      - targets: ['model_server:8500']
